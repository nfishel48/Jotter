name: CI

on:
  push:
    # main is deliberately excluded: release.yml calls this same workflow, so a
    # standalone run there would duplicate the work and — worse — collide on
    # the concurrency group below and cancel the release's own test job.
    branches-ignore: [main]
  pull_request:
  workflow_call: # so release.yml can gate on exactly this suite

concurrency:
  # Supersede in-flight runs for the same branch; the newest push is the one
  # anyone cares about.
  #
  # github.workflow is included because in a reusable workflow it resolves to
  # the *caller's* name ("Release"), keeping release runs in a separate group
  # from direct CI runs. Without it both evaluate to the same key and cancel
  # each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings # a warning that reaches main is a warning forever

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # a Linux-only break should not hide a macOS-only one
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Needed to *compile* on Linux, not to run: the pipewire/alsa -sys crates
      # need real headers, and eframe + tray-icon pull in gtk/x11/wayland.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libasound2-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked

      # Runners are headless with no audio devices, so the suite deliberately
      # covers only pure logic — conversion, downmix, the loopback duplex
      # guard, metadata. Anything touching cpal device enumeration would be
      # flaky here and belongs in scripts/check_audio.sh instead.
      - name: Test
        run: cargo test --all-targets --locked

      - name: Build
        run: cargo build --locked
