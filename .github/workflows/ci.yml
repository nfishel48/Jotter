name: CI

on:
  push:
    # main is deliberately excluded: release.yml calls this same workflow, so a
    # standalone run there would duplicate the work and — worse — collide on
    # the concurrency group below and cancel the release's own test job.
    branches-ignore: [main]
  pull_request:
  workflow_call: # so release.yml can gate on exactly this suite

concurrency:
  # Supersede in-flight runs for the same branch; the newest push is the one
  # anyone cares about.
  #
  # github.workflow is included because in a reusable workflow it resolves to
  # the *caller's* name ("Release"), keeping release runs in a separate group
  # from direct CI runs. Without it both evaluate to the same key and cancel
  # each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings # a warning that reaches main is a warning forever

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # a Linux-only break should not hide a macOS-only one
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # The `aec` feature builds WebRTC's AudioProcessing from source, which is
      # an autotools/meson project. `bundled` is deliberate: linking a system
      # libwebrtc-audio-processing would make the build depend on a package most
      # distros ship at a different major version.
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config meson ninja

      # Needed to *compile* on Linux, not to run: the pipewire/alsa -sys crates
      # need real headers, and eframe + tray-icon pull in gtk/x11/wayland.
      #
      # cmake is for aws-lc-sys, which builds a C crypto library and arrives via
      # posthog-rs -> reqwest -> rustls. GitHub's image happens to ship it, but
      # depending on that implicitly is how a release breaks on an image bump.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev cmake \
            meson ninja-build \
            libpipewire-0.3-dev libspa-0.2-dev \
            libasound2-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked

      # Runners are headless with no audio devices, so the suite deliberately
      # covers only pure logic — conversion, downmix, the loopback duplex
      # guard, metadata. Anything touching cpal device enumeration would be
      # flaky here and belongs in scripts/check_audio.sh instead.
      - name: Test
        run: cargo test --all-targets --locked

      - name: Build
        run: cargo build --locked

      # The GUI and the CLI are cfg'd halves of one binary, so a change that
      # only compiles with both features on is easy to miss. RUSTFLAGS above
      # makes an import that is unused under one feature a hard failure here.
      - name: Build (feature matrix)
        run: |
          cargo check --locked --no-default-features --features cli
          cargo check --locked --no-default-features --features gui
          # `telemetry` has a no-op shim so that no call site needs a cfg, which
          # means the shim's signatures can drift from the real ones without
          # anything noticing until a packager builds without it. Both halves
          # get checked against both front ends.
          cargo check --locked --no-default-features --features cli,telemetry
          cargo check --locked --no-default-features --features gui,telemetry
          cargo check --locked --no-default-features --features gui,cli
          # `aec` builds WebRTC's AudioProcessing from source. The leg that
          # matters most is the one *without* it: a distro or fork that turns
          # `aec` off must not need meson, ninja or a C++ toolchain at all, and
          # the only way that stays true is by checking it.
          cargo check --locked --no-default-features --features cli,aec
          cargo check --locked --no-default-features --features gui,aec
