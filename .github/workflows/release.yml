name: Release

on:
  push:
    branches: [main]

# Only one release at a time: two concurrent runs would race on the version
# number and could claim the same one twice. Not cancel-in-progress — a
# half-finished release that has already pushed a tag must be allowed to
# finish publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version bump, create the release

env:
  CARGO_TERM_COLOR: always

jobs:
  # Exactly the suite CI runs, so "tests pass" means the same thing on a
  # release as on a branch push.
  test:
    uses: ./.github/workflows/ci.yml

  # Works out the number only. Nothing is committed, tagged or pushed until
  # every platform has produced a binary — see `publish`.
  version:
    name: Work out the next version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # A shallow checkout cannot push, and `publish` builds the changelog
          # from tag history.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Compute the next version
        id: next
        run: |
          set -euo pipefail
          # The bump is applied to the working tree and thrown away. Every
          # other job re-applies it to the same commit, which is deterministic:
          # the script derives the number from Cargo.toml alone.
          VERSION="$(./scripts/bump_version.sh patch)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Pin the tip of main here and build, tag and release that exact
          # commit everywhere below, so the binaries and the tag cannot end up
          # describing different source.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Apple Silicon only, by decision: Intel Macs are not supported, so there is
  # one native arm64 build and no universal binary to assemble. Native rather
  # than cross-built for a reason that outlives the Intel leg — `aec` builds
  # WebRTC's AudioProcessing (and abseil) from C++ source with meson, and that
  # build compiles for the host whatever `--target` says. Cross-building
  # x86_64 that way is what sank v0.1.7.
  build-macos:
    name: Build macOS (arm64)
    needs: version
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-arm64

      # See ci.yml: rust-cache empties this directory but keeps the build
      # script's record of it.
      - name: Reset the sherpa-onnx prebuilt cache
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          if [ -d target ]; then
            find target -type d \( -path '*/build/sherpa-onnx-sys-*' -o -path '*/.fingerprint/sherpa-onnx-sys-*' \) \
              -prune -exec rm -rf {} +
          fi

      # Mirrors ci.yml: the `aec` feature builds WebRTC's AudioProcessing from
      # source, which is a meson project.
      - name: Install macOS build dependencies
        run: brew install pkg-config meson ninja

      - name: Apply the version bump
        env:
          EXPECT: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Not committed here — this only bakes CARGO_PKG_VERSION into the
          # binary. `publish` makes the one commit, once the builds are in.
          VERSION="$(./scripts/bump_version.sh patch)"
          [ "$VERSION" = "$EXPECT" ] || {
            echo "::error::bumped to $VERSION, expected $EXPECT"
            exit 1
          }

      - name: Build and package the .app
        env:
          # A repo *variable*, not a secret. PostHog project tokens are
          # write-only and public by design — every site running PostHog serves
          # one in its page source — so there is nothing to protect, and a
          # secret would additionally be unavailable to fork PRs. Unset simply
          # builds a binary that sends nothing, which is what a fork should get.
          JOTTER_POSTHOG_KEY: ${{ vars.JOTTER_POSTHOG_KEY }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p jotter-cli --bin jotter

          # Assert the architecture rather than trust the runner label: a
          # relabelled image would otherwise ship an Intel binary as arm64.
          lipo -info target/release/jotter
          lipo -info target/release/jotter | grep -q arm64 || {
            echo "::error::target/release/jotter is not arm64"
            exit 1
          }

          # The .app is the shippable unit, not the bare binary: macOS will not
          # grant system-audio access to an executable with no bundle identity.
          SKIP_BUILD=1 PROFILE=release ./scripts/bundle.sh

          ditto -c -k --keepParent build/Jotter.app "Jotter-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Jotter-macos-arm64
          path: Jotter-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  # Debian 12 rather than the runner's Ubuntu: a binary needs at least the glibc
  # it was linked against, and built on ubuntu-latest (glibc 2.39) it would not
  # start on Debian 12 (2.36), the oldest release Jotter supports. See
  # scripts/linux_release_deps.sh, which is also what
  # `scripts/check_linux_build.sh package` runs to reproduce this job locally.
  build-linux:
    name: Build Linux (x86_64)
    needs: version
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-bookworm

      # See ci.yml: rust-cache empties this directory but keeps the build
      # script's record of it.
      - name: Reset the sherpa-onnx prebuilt cache
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          if [ -d target ]; then
            find target -type d \( -path '*/build/sherpa-onnx-sys-*' -o -path '*/.fingerprint/sherpa-onnx-sys-*' \) \
              -prune -exec rm -rf {} +
          fi

      - name: Install Linux build dependencies
        run: scripts/linux_release_deps.sh

      - name: Apply the version bump
        env:
          EXPECT: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(./scripts/bump_version.sh patch)"
          [ "$VERSION" = "$EXPECT" ] || {
            echo "::error::bumped to $VERSION, expected $EXPECT"
            exit 1
          }

      - name: Build Linux binary
        env:
          # See the macOS build for why this is a variable rather than a secret.
          JOTTER_POSTHOG_KEY: ${{ vars.JOTTER_POSTHOG_KEY }}
        run: cargo build --release --locked -p jotter-cli --bin jotter

      # The tarball, the .deb and the .rpm, all around the one binary built
      # above, with their final file names.
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: jotter-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Install the packages on each distribution they claim to support, before
  # anything is tagged. What this catches is a dependency that does not exist
  # under that name there (the t64 renames) or a library the binary needs that
  # nothing pulls in — `ldd` reporting "not found". It cannot catch a capture
  # regression: containers have no PipeWire session.
  install-test:
    name: Install test (${{ matrix.image }})
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:24.04", "fedora:latest"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jotter-linux-x86_64
          path: dist

      - name: Install the package
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y ./dist/*.deb
          else
            dnf install -y ./dist/*.rpm
          fi

      - name: Run it
        env:
          EXPECT: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if ldd /usr/bin/jotter | grep 'not found'; then
            echo "::error::a library jotter links is not installed by the package"
            exit 1
          fi
          REPORTED="$(jotter --version 2>/dev/null)"
          [ "$REPORTED" = "jotter $EXPECT" ] || {
            echo "::error::jotter --version printed '$REPORTED', expected 'jotter $EXPECT'"
            exit 1
          }
          jotter --help >/dev/null

  # The tag is cut here and nowhere else. Everything above builds from an
  # untagged tree, so a build that fails costs a re-run rather than a version
  # number: v0.1.7 was tagged before the macOS build ran, and when that build
  # failed the number was spent on a release that does not exist.
  publish:
    name: Tag and publish
    needs: [version, build-macos, build-linux, install-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          # Need tag history to build the changelog range.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # Named explicitly rather than merged, so nothing else a job uploads can
      # land in `dist/` and be published by the glob below.
      - uses: actions/download-artifact@v4
        with:
          name: Jotter-macos-arm64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: jotter-linux-x86_64
          path: dist

      - name: Commit the bump and tag
        env:
          EXPECT: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(./scripts/bump_version.sh patch)"
          [ "$VERSION" = "$EXPECT" ] || {
            echo "::error::bumped to $VERSION, expected $EXPECT"
            exit 1
          }

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock

          # [skip ci] is belt-and-braces: pushes authenticated with
          # GITHUB_TOKEN do not trigger workflow runs, so this cannot loop.
          git commit -m "chore: release v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Release v$VERSION"

          # Fast-forward only (the default for a plain push), and main must
          # still be the commit these binaries were built from. If anything
          # else landed while the builds ran, this is rejected and the release
          # fails *before* tagging — rather than publishing binaries whose
          # source is not what the tag points at.
          git push origin HEAD:main --follow-tags

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist

          # Renamed here rather than in the build job so the version appears
          # in the downloaded filename without threading it through artifacts.
          # The Linux files are named by scripts/package_linux.sh already.
          mv dist/Jotter-macos-arm64.zip "dist/Jotter-$VERSION-macos-arm64.zip"

          cat > notes.md <<'EOF'
          Jotter is a command-line recorder: `jotter record` captures your
          microphone and everyone else's audio as two tracks, then removes
          speaker echo, transcribes and labels speakers offline. `jotter --help`
          lists every command.

          ## Install

          ### macOS (Apple Silicon)

          Apple Silicon only: Intel Macs are not supported.

          Download the `.zip`, unzip, and move `Jotter.app` to `/Applications`.
          The app is **ad-hoc signed, not notarized**, so Gatekeeper will refuse
          it on first launch. Clear the quarantine flag:

          ```
          xattr -dr com.apple.quarantine /Applications/Jotter.app
          ```

          The bundle has no window; it exists because macOS will not grant
          system-audio access to an executable with no bundle identity. Put the
          `jotter` inside it on your `PATH` and `jotter start` runs the recorder
          through the bundle, so the permission is attributed to Jotter:

          ```
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /Applications/Jotter.app/Contents/MacOS/jotter /usr/local/bin/jotter
          ```

          On first recording, approve **Microphone**, **Screen & System Audio
          Recording**, and **Documents** access.

          ### Debian 12+, Ubuntu 24.04+ (apt)

          ```
          sudo curl -fsSLo /usr/share/keyrings/jotter.asc https://nfishel48.github.io/Jotter/jotter.asc
          sudo curl -fsSLo /etc/apt/sources.list.d/jotter.sources https://nfishel48.github.io/Jotter/jotter.sources
          sudo apt update && sudo apt install jotter
          ```

          ### Fedora (dnf)

          ```
          sudo curl -fsSLo /etc/yum.repos.d/jotter.repo https://nfishel48.github.io/Jotter/jotter.repo
          sudo dnf install jotter
          ```

          ### Linux, by hand

          The `.deb` and `.rpm` below install directly, or unpack the tarball:

          ```
          tar -xzf jotter-VERSION-linux-x86_64.tar.gz
          ./jotter-VERSION-linux-x86_64/jotter record --duration 600
          ```

          Linux needs a running **PipeWire** session — system-audio capture uses
          PipeWire monitor capture and cannot work on the ALSA fallback. x86_64
          only.

          > Linux is **compile-verified only**. Capture has not been confirmed
          > against a live PipeWire session.

          Recordings are written to `~/Documents/Jotter/`, one folder per session
          containing `mic.wav`, `system.wav` and `meta.json`, plus
          `transcript.json` once transcription has run (`jotter models pull`
          fetches the speech models first).
          EOF

          sed -i "s/VERSION/$VERSION/g" notes.md

          # Changelog built by hand rather than with --generate-notes, which is
          # not reliably combinable with --notes-file.
          PREV="$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || true)"
          {
            echo
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s (%h)' "$PREV..v$VERSION"
            else
              echo "- Initial release"
            fi
          } >> notes.md

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file notes.md \
            dist/*.zip dist/*.tar.gz dist/*.deb dist/*.rpm

  # The channels below run once the release exists, and each only repackages
  # what `publish` released. A failure here leaves the GitHub release intact;
  # re-run the failed job. Their secrets are listed in docs/CI_CD.md.
  #
  # publish-tap and publish-aur stay skipped until their repository variable
  # (PUBLISH_HOMEBREW, PUBLISH_AUR) is set to `true`, which is the last step of
  # setting each channel up. Until then a release is not marked failed for a
  # channel that does not exist yet.

  # The apt and dnf repositories on GitHub Pages, rebuilt from scratch from the
  # last three releases' packages every time, so the site never grows.
  publish-repos:
    name: Publish apt and dnf repositories
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg

      - name: Import the signing key
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$REPO_GPG_PRIVATE_KEY" ] || {
            echo "::error::secret REPO_GPG_PRIVATE_KEY is not set; see docs/CI_CD.md"
            exit 1
          }
          printf '%s\n' "$REPO_GPG_PRIVATE_KEY" | gpg --batch --import
          FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          echo "REPO_GPG_KEY_ID=$FPR" >> "$GITHUB_ENV"

      - name: Fetch the last three releases' packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir packages
          for tag in $(gh release list --limit 3 --json tagName -q '.[].tagName'); do
            # Releases from before packaging have no .deb or .rpm to fetch.
            gh release download "$tag" --dir packages --pattern '*.deb' --pattern '*.rpm' || true
          done
          ls -l packages

      - name: Build the repositories
        env:
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: scripts/build_package_repo.sh packages site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

  # Formula/jotter.rb in <owner>/homebrew-tap, rendered from
  # packaging/homebrew/jotter.rb. On macOS so the rendered formula is installed
  # and tested before anyone else can get it.
  publish-tap:
    if: vars.PUBLISH_HOMEBREW == 'true'
    name: Update the Homebrew tap
    needs: [version, publish]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAP: ${{ github.repository_owner }}/homebrew-tap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: Jotter-macos-arm64
          path: dist

      - name: Check out the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$TAP_TOKEN" ] || {
            echo "::error::secret HOMEBREW_TAP_TOKEN is not set; see docs/CI_CD.md"
            exit 1
          }
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$TAP.git" tap

      - name: Render the formula
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 dist/Jotter-macos-arm64.zip | cut -d' ' -f1)"
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA/g" \
            packaging/homebrew/jotter.rb > tap/Formula/jotter.rb

      # Installed from a local tap, which is what a user's `brew install`
      # evaluates too; the release asset it downloads is already public.
      - name: Install and test the formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew tap-new --no-git local/jottertest
          cp tap/Formula/jotter.rb "$(brew --repository local/jottertest)/Formula/"
          brew install local/jottertest/jotter
          brew test local/jottertest/jotter
          codesign --verify --deep --strict "$(brew --prefix jotter)/Jotter.app"

      - name: Push the formula
        run: |
          set -euo pipefail
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/jotter.rb
          # A re-run after a later step failed finds the formula already there.
          if git diff --cached --quiet; then
            echo "Formula/jotter.rb already at $VERSION"
            exit 0
          fi
          git commit -m "jotter $VERSION"
          git push origin HEAD

  # jotter-bin on the AUR, from packaging/aur/PKGBUILD. The action computes
  # the checksum from the published tarball, test-builds the package in an
  # Arch container and regenerates .SRCINFO before pushing.
  publish-aur:
    if: vars.PUBLISH_AUR == 'true'
    name: Update the AUR package
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$AUR_SSH_PRIVATE_KEY" ] || {
            echo "::error::secret AUR_SSH_PRIVATE_KEY is not set; see docs/CI_CD.md"
            exit 1
          }
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/aur/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: jotter-bin
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: Nathan Fishel
          commit_email: nfishel@proton.me
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ needs.version.outputs.version }}
