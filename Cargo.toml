[package]
name = "jotter"
version = "0.1.4"
edition = "2024"

[lib]
name = "jotter"
path = "src/lib.rs"

[[bin]]
name = "jotter"
path = "src/main.rs"

[features]
default = ["gui", "cli"]
# The tray app. Pulls in the whole desktop stack — eframe/egui plus, on Linux,
# gtk/x11/wayland via tray-icon — which is why a CLI-only build turns it off.
gui = ["dep:eframe", "dep:egui", "dep:image", "dep:tray-icon"]
# The `record` / `devices` subcommands.
cli = ["dep:clap"]

[dependencies]
# For local-time folder names. Worth the dependency: deriving a DST-correct
# local offset by hand is a real bug surface, and the default features include
# the `clock` support needed for Local::now().
chrono = "0.4"
cpal = "0.18"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4.6", features = ["derive"], optional = true }
eframe = { version = "0.36.1", optional = true }
egui = { version = "0.36.1", optional = true }
image = { version = "0.25.10", optional = true }
# default-features off to drop `libxdo`, which is otherwise a hard `-lxdo` link
# on Linux. muda uses it only to synthesise X11 key events for predefined menu
# items (Copy/Paste/…); our menu is custom items only. It is also useless on a
# Wayland session, which cannot be driven by XTEST.
tray-icon = { version = "0.24.2", optional = true, default-features = false, features = [
  "gtk",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Cargo unions this with the base cpal dependency above, so Linux builds
# additionally get the native PipeWire host. cpal's default_host() then prefers
# PipeWire over PulseAudio and ALSA automatically when the daemon is running,
# so no host selection is needed in our code.
#
# This feature is what makes system-audio capture work on Linux: opening an
# input stream on a sink makes the host set STREAM_CAPTURE_SINK, which is
# PipeWire's monitor-capture mechanism. The ALSA fallback has no equivalent.
cpal = { version = "0.18", features = ["pipewire"] }
