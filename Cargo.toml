[package]
name = "jotter"
version = "0.1.5"
edition = "2024"

[lib]
name = "jotter"
path = "src/lib.rs"

[[bin]]
name = "jotter"
path = "src/main.rs"

[features]
default = ["gui", "cli", "telemetry", "aec"]
# The tray app. Pulls in the whole desktop stack — eframe/egui plus, on Linux,
# gtk/x11/wayland via tray-icon — which is why a CLI-only build turns it off.
gui = ["dep:eframe", "dep:egui", "dep:image", "dep:tray-icon"]
# The `record` / `devices` subcommands.
cli = ["dep:clap"]
# Anonymous usage and crash reporting. Off means the binary has no HTTP client
# and no async runtime at all — the whole network stack is behind this flag, so
# a distro or fork rebuild can produce a provably offline binary. Everything in
# `src/telemetry` has a no-op shim, so no call site is `cfg`-gated.
telemetry = ["dep:posthog-rs", "dep:tokio", "dep:uuid"]
# Offline echo cancellation: removing speaker bleed from the mic track after a
# recording ends. Off means no C compiler is needed to build jotter at all —
# `build.rs` returns immediately — which is the same guarantee `telemetry` gives
# for the network stack. The canceller is vendored Speex C; see
# `src/audio/aec/vendor/README.md` for why it is vendored rather than a dependency.
aec = []

[dependencies]
# For local-time folder names. Worth the dependency: deriving a DST-correct
# local offset by hand is a real bug surface, and the default features include
# the `clock` support needed for Local::now().
chrono = "0.4"
cpal = "0.18"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4.6", features = ["derive"], optional = true }
eframe = { version = "0.36.1", optional = true }
egui = { version = "0.36.1", optional = true }
image = { version = "0.25.10", optional = true }
# default-features off to drop `libxdo`, which is otherwise a hard `-lxdo` link
# on Linux. muda uses it only to synthesise X11 key events for predefined menu
# items (Copy/Paste/…); our menu is custom items only. It is also useless on a
# Wayland session, which cannot be driven by XTEST.
tray-icon = { version = "0.24.2", optional = true, default-features = false, features = [
  "gtk",
] }

# Default features are what we want: `async-client` (+ tokio) and
# `error-tracking`, which is what supplies the panic hook and the symbolicated
# stack traces. Local flag evaluation is deliberately unused — it needs a
# personal API key, and there is nowhere to hide one in an open-source binary.
posthog-rs = { version = "0.25", optional = true }
# Only the runtime; posthog-rs brings its own reqwest/hyper stack. One worker
# thread is plenty for a handful of events per session.
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
# The install id. v4 only: it must be random, not derived from anything about
# the machine.
uuid = { version = "1", features = ["v4"], optional = true }

[build-dependencies]
# Compiles the vendored Speex echo canceller. The right tool rather than a system
# library or meson: it derives `-arch`/`--target` from Cargo's target triple,
# which is what keeps the universal-binary release in release.yml working.
#
# Not optional, and it cannot be: Cargo passes features to a build script as
# `CARGO_FEATURE_*` environment variables, never as `cfg(feature = ...)`, so
# `build.rs` cannot conditionally reference an optional build dependency — the
# path has to resolve even when the feature is off. `cc` is pure Rust and
# compiling it needs no C toolchain; `build.rs` checks the environment variable
# and returns before invoking a compiler, so an `aec`-less build still never
# needs one.
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Cargo unions this with the base cpal dependency above, so Linux builds
# additionally get the native PipeWire host. cpal's default_host() then prefers
# PipeWire over PulseAudio and ALSA automatically when the daemon is running,
# so no host selection is needed in our code.
#
# This feature is what makes system-audio capture work on Linux: opening an
# input stream on a sink makes the host set STREAM_CAPTURE_SINK, which is
# PipeWire's monitor-capture mechanism. The ALSA fallback has no equivalent.
cpal = { version = "0.18", features = ["pipewire"] }
