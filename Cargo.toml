[workspace]
# Two crates, split along the line a host application cares about: `jotter` is
# the library — capture, the offline passes, the model catalogue — and
# `jotter-cli` is the `jotter` binary built on it. Keeping clap and every
# terminal concern out of the library is what lets another program depend on it
# without inheriting a command-line parser it will never use.
members = ["crates/*"]
# Explicit because a virtual manifest has no `edition` of its own to infer the
# resolver from, and would otherwise fall back to resolver 1 — the pre-2021
# feature unification, under which a dev- or build-dependency's features leak
# into the normal build. The feature matrix in CI is only meaningful if a
# `--no-default-features` build really is one.
resolver = "3"

# One version for both crates. They are released together from one tag, and a
# CLI reporting a different version from the library it was built with would
# only ever confuse a bug report. `scripts/bump_version.sh` rewrites this line.
[workspace.package]
version = "0.1.16"
edition = "2024"
repository = "https://github.com/nfishel48/Jotter"
