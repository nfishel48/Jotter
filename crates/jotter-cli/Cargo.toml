[package]
name = "jotter-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "The `jotter` command: record a meeting to two tracks, then clean, transcribe and label it offline"

# Named `jotter` although the package is `jotter-cli`: the package name only
# has to differ from the library's, and the command people type should not.
[[bin]]
name = "jotter"
path = "src/main.rs"

# The benchmark driver. A separate binary rather than a `jotter` subcommand
# because it is developer tooling: nothing a user installs should carry it, and
# `required-features` on a non-default feature is what guarantees that — the
# release bundle builds the default set and never sees this file.
[[bin]]
name = "jotter-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[features]
# Everything the library offers, plus telemetry. The library leaves telemetry
# off for host applications; this is the one program that reports as Jotter,
# so it is the one place that turns it on.
default = ["aec", "transcribe", "diarize", "telemetry"]
# Each flag forwards to the library feature of the same name, which is where
# the dependency (and the reason for making it optional) lives. They exist here
# so a packager can build the command with any subset — `--no-default-features`
# on this crate alone must be enough to produce an offline or C++-free binary.
aec = ["jotter/aec"]
transcribe = ["jotter/transcribe"]
diarize = ["transcribe", "jotter/diarize"]
telemetry = ["jotter/telemetry"]
# The `jotter-bench` binary: word error rate over a speech corpus, for
# `benchmarks/`. Off by default and never shipped.
#
# It exists because `jotter transcribe` is the wrong shape for a corpus. That
# command takes a recording directory and builds a recogniser per call, and
# LibriSpeech test-clean is 2620 utterances — reloading 660 MB of model that
# many times is hours of the benchmark measuring its own startup. This loads the
# model once and walks a manifest.
#
# What it must not become is a second implementation of the pipeline: a
# benchmark of a reimplementation measures the reimplementation. It calls
# `audio::transcribe::transcribe_track`, the same function the real pass calls,
# which is why that function is `pub`. `benchmarks/bench verify` checks the two
# paths still agree.
bench = ["transcribe", "dep:sherpa-onnx", "dep:hound"]

[dependencies]
# Features are chosen by this crate's own flags above, never by the library's
# defaults: with those left on, `--no-default-features` here would still build
# every stage, and the offline and C++-free builds would be impossible to make.
jotter = { path = "../jotter", default-features = false }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same version as the library's, so the lockfile resolves one copy.
chrono = "0.4"
# Process control for background sessions: signalling the recorder, checking
# it is still the process it claims to be, and detaching it from the terminal.
libc = "0.2"

# `jotter-bench` only. Its `--segmentation none` path feeds a whole clip to the
# recogniser, which is the one thing the library's pass never does, so it
# resamples and measures clips itself. Same version requirements as the
# library's, so the lockfile resolves both to one copy — sherpa-onnx links a
# static archive, and two of them would not link at all.
hound = { version = "3.5", optional = true }
sherpa-onnx = { version = "1.13", optional = true }

# Linux packages, built from the release binary by `scripts/package_linux.sh`
# (cargo-deb, cargo-generate-rpm) and served from the apt/dnf repository on
# GitHub Pages. The package is `jotter`, like the command.
#
# Built on Debian 12. The versions below are what that binary's symbols
# actually require (GLIBC_2.34, GLIBCXX_3.4.30 from GCC 12). The runtime
# libraries are named by hand rather than with cargo-deb's `$auto`: that would
# name them as bookworm does, and Debian 13 and Ubuntu 24.04 renamed both in the
# 64-bit time_t transition (`libasound2t64`, `libpipewire-0.3-0t64`). Each
# dependency accepts either name, so one .deb installs on all three.
[package.metadata.deb]
name = "jotter"
maintainer = "Nathan Fishel <nfishel@proton.me>"
copyright = "2026, Nathan Fishel"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Jotter records your microphone and the computer's audio as two separate \
tracks, transcribes them on-device while the meeting is still going, and \
serves what has been said through a command-line interface built for \
programs. Echo cancellation, transcription and speaker labelling all run \
locally. Speech models are fetched separately with `jotter models pull`."""
section = "sound"
priority = "optional"
depends = "libc6 (>= 2.34), libgcc-s1, libstdc++6 (>= 12), libasound2t64 | libasound2 (>= 1.0.16), libpipewire-0.3-0t64 | libpipewire-0.3-0 (>= 0.3.65)"
# System capture is PipeWire monitor capture; the library alone does nothing
# without the daemon, which every supported desktop already runs.
recommends = "pipewire"
assets = [
  ["target/release/jotter", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/jotter/README.md", "644"],
  ["../../docs/AUDIO_CAPTURE.md", "usr/share/doc/jotter/AUDIO_CAPTURE.md", "644"],
]

# `Requires` are generated from the binary's ELF dependencies (sonames such as
# `libpipewire-0.3.so.0()(64bit)`), which Fedora and openSUSE resolve under
# their own package names — so nothing is named by hand here.
[package.metadata.generate-rpm]
name = "jotter"
summary = "Record meetings as two tracks and transcribe them offline"
assets = [
  { source = "target/release/jotter", dest = "/usr/bin/jotter", mode = "755" },
  { source = "../../LICENSE", dest = "/usr/share/licenses/jotter/LICENSE", mode = "644", doc = true },
  { source = "../../README.md", dest = "/usr/share/doc/jotter/README.md", mode = "644", doc = true },
  { source = "../../docs/AUDIO_CAPTURE.md", dest = "/usr/share/doc/jotter/AUDIO_CAPTURE.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.recommends]
pipewire = "*"
